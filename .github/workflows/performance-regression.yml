name: Performance Regression Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance-benchmark:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for baseline comparison

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Storybook for performance testing
        run: pnpm run build-storybook

      - name: Run performance tests
        timeout-minutes: 5
        run: |
          # Create performance test script
          cat > performance-test.cjs << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          async function runPerformanceTests() {
            const browser = await chromium.launch();
            const context = await browser.newContext();
            const page = await context.newPage();

            const results = {};

            // Test 1: Storybook load time
            console.log('Testing Storybook load time...');
            const startTime = Date.now();
            await page.goto('http://localhost:6006', { waitUntil: 'domcontentloaded', timeout: 30000 });
            // Wait for Storybook to be ready (look for the main content)
            await page.waitForSelector('#storybook-root', { timeout: 30000 }).catch(() => {});
            results.bundleLoadTime = Date.now() - startTime;
            console.log(`Storybook loaded in ${results.bundleLoadTime}ms`);

            // Test 2: Navigate to a component story and measure render time
            console.log('Testing component render performance...');
            const renderTimes = {};

            // Test button story
            const buttonStart = Date.now();
            await page.goto('http://localhost:6006/?path=/story/components-button--default', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await page.waitForTimeout(2000); // Allow component to render
            renderTimes.button = Date.now() - buttonStart;
            console.log(`Button story loaded in ${renderTimes.button}ms`);

            // Test accordion story
            const accordionStart = Date.now();
            await page.goto('http://localhost:6006/?path=/story/components-accordion--default', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await page.waitForTimeout(2000);
            renderTimes.accordion = Date.now() - accordionStart;
            console.log(`Accordion story loaded in ${renderTimes.accordion}ms`);

            results.componentRenderTimes = renderTimes;

            // Test 3: Memory usage (using CDP session for Chrome metrics)
            console.log('Testing memory usage...');
            const cdpSession = await context.newCDPSession(page);
            const metrics = await cdpSession.send('Performance.getMetrics');
            const jsHeapUsed = metrics.metrics.find(m => m.name === 'JSHeapUsedSize')?.value || 0;
            const jsHeapTotal = metrics.metrics.find(m => m.name === 'JSHeapTotalSize')?.value || 0;
            results.memoryUsage = {
              jsHeapUsedSize: jsHeapUsed,
              jsHeapTotalSize: jsHeapTotal
            };
            console.log(`Memory: ${(jsHeapUsed / 1024 / 1024).toFixed(1)}MB used`);

            // Test 4: Bundle size analysis (check storybook-static assets)
            console.log('Analyzing bundle sizes...');
            const bundleSizes = {};
            const assetsDir = 'storybook-static/assets';
            if (fs.existsSync(assetsDir)) {
              const files = fs.readdirSync(assetsDir);
              for (const file of files) {
                if (file.endsWith('.js') || file.endsWith('.css')) {
                  const stats = fs.statSync(path.join(assetsDir, file));
                  bundleSizes[file] = stats.size;
                }
              }
            }
            results.bundleSizes = bundleSizes;
            console.log(`Found ${Object.keys(bundleSizes).length} asset files`);

            await browser.close();

            // Save results
            fs.writeFileSync('performance-results.json', JSON.stringify(results, null, 2));
            console.log('Performance results saved');

            return results;
          }

          runPerformanceTests()
            .then(() => process.exit(0))
            .catch(err => {
              console.error('Performance test failed:', err);
              process.exit(1);
            });
          EOF

          # Start http-server to serve storybook-static
          npx http-server storybook-static -p 6006 &
          SERVER_PID=$!

          # Wait for server to start
          sleep 3

          # Run performance tests with timeout
          timeout 180 node performance-test.cjs || {
            echo "Performance tests timed out or failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          # Kill server
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.json

      - name: Download baseline performance data
        uses: actions/download-artifact@v4
        with:
          name: baseline-performance
          path: baseline/
        continue-on-error: true

      - name: Compare with baseline
        run: |
          node -e "
          const fs = require('fs');
          const current = JSON.parse(fs.readFileSync('performance-results.json', 'utf8'));

          let baseline = {};
          try {
            baseline = JSON.parse(fs.readFileSync('baseline/performance-results.json', 'utf8'));
          } catch (e) {
            console.log('No baseline found, setting current as baseline');
            process.exit(0);
          }

          console.log('## 🚀 Performance Comparison Report');
          console.log('');

          // Bundle load time comparison
          const loadTimeDiff = current.bundleLoadTime - baseline.bundleLoadTime;
          const loadTimePct = ((loadTimeDiff / baseline.bundleLoadTime) * 100).toFixed(1);
          console.log('### Bundle Load Time');
          console.log(\`- Current: \${current.bundleLoadTime.toFixed(1)}ms\`);
          console.log(\`- Baseline: \${baseline.bundleLoadTime.toFixed(1)}ms\`);
          console.log(\`- Change: \${loadTimeDiff > 0 ? '+' : ''}\${loadTimeDiff.toFixed(1)}ms (\${loadTimePct > 0 ? '+' : ''}\${loadTimePct}%)\`);

          // Component render times
          console.log('');
          console.log('### Component Render Times');
          for (const [component, time] of Object.entries(current.componentRenderTimes)) {
            const baseTime = baseline.componentRenderTimes?.[component] || time;
            const diff = time - baseTime;
            const pct = ((diff / baseTime) * 100).toFixed(1);
            console.log(\`- \${component}: \${time}ms (change: \${diff > 0 ? '+' : ''}\${diff}ms, \${pct}%)\`);
          }

          // Memory usage
          console.log('');
          console.log('### Memory Usage');
          const memDiff = current.memoryUsage.jsHeapUsedSize - (baseline.memoryUsage?.jsHeapUsedSize || current.memoryUsage.jsHeapUsedSize);
          const memPct = ((memDiff / (baseline.memoryUsage?.jsHeapUsedSize || current.memoryUsage.jsHeapUsedSize)) * 100).toFixed(1);
          console.log(\`- JS Heap Used: \${(current.memoryUsage.jsHeapUsedSize / 1024 / 1024).toFixed(1)}MB\`);
          console.log(\`- Change: \${memDiff > 0 ? '+' : ''}\${(memDiff / 1024 / 1024).toFixed(1)}MB (\${memPct}%)\`);

          // Bundle sizes
          console.log('');
          console.log('### Bundle Sizes');
          for (const [file, size] of Object.entries(current.bundleSizes)) {
            const baseSize = baseline.bundleSizes?.[file] || size;
            const diff = size - baseSize;
            const pct = ((diff / baseSize) * 100).toFixed(1);
            console.log(\`- \${file}: \${(size / 1024).toFixed(1)}KB (change: \${diff > 0 ? '+' : ''}\${(diff / 1024).toFixed(1)}KB, \${pct}%)\`);
          }

          // Check for regressions
          const regressions = [];
          if (loadTimeDiff > baseline.bundleLoadTime * 0.1) {
            regressions.push(\`Bundle load time increased by \${loadTimePct}%\`);
          }

          for (const [component, time] of Object.entries(current.componentRenderTimes)) {
            const baseTime = baseline.componentRenderTimes?.[component];
            if (baseTime && time > baseTime * 1.2) {
              regressions.push(\`\${component} render time increased by \${((time - baseTime) / baseTime * 100).toFixed(1)}%\`);
            }
          }

          if (regressions.length > 0) {
            console.log('');
            console.log('## ⚠️ Performance Regressions Detected');
            regressions.forEach(r => console.log(\`- \${r}\`));
            process.exit(1);
          } else {
            console.log('');
            console.log('## ✅ No significant performance regressions detected');
          }
          " >> $GITHUB_STEP_SUMMARY

      - name: Update baseline (on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-performance
          path: performance-results.json

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x http-server
          # Start http-server to serve static storybook build
          http-server storybook-static -p 6006 &
          SERVER_PID=$!
          sleep 5
          # Run Lighthouse against the static build
          lhci autorun --collect.url="http://localhost:6006/" --collect.startServerCommand="" || true
          kill $SERVER_PID || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/

  performance-summary:
    name: Performance Summary
    needs: [performance-benchmark, lighthouse-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create performance summary
        run: |
          echo "## 🎯 Performance Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Benchmarks | ${{ needs.performance-benchmark.result == 'success' && '✅ No Regressions' || '⚠️ Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse-audit.result == 'success' && '✅ Passed' || '⚠️ Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed performance reports are available in the artifacts." >> $GITHUB_STEP_SUMMARY
