name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip NPM publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            # Check if there are changesets other than README.md
            CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)
            if [ -n "$CHANGESETS" ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
              echo "📦 Found changesets to publish:"
              echo "$CHANGESETS"
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "⚠️ No changesets found (only README.md)"
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "⚠️ No changesets found"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          echo "📝 Versioning packages..."
          pnpm changeset version
          echo "✅ Packages versioned"

      - name: Commit version changes
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git add .
          git commit -m "chore: version packages" || echo "No changes to commit"
          git push origin main
          echo "✅ Version changes committed and pushed"

      - name: Publish to NPM (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' && steps.changesets.outputs.has_changesets == 'true' }}
        run: |
          echo "🏃 DRY RUN - Would publish these packages:"
          pnpm changeset publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        if: ${{ github.event.inputs.dry_run != 'true' && steps.changesets.outputs.has_changesets == 'true' }}
        run: |
          echo "📦 Publishing to NPM..."
          pnpm changeset publish
          echo "✅ Published to NPM"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tags
        if: ${{ github.event.inputs.dry_run != 'true' && steps.changesets.outputs.has_changesets == 'true' }}
        run: |
          git push origin --tags
          echo "✅ Tags pushed"

      - name: No changesets summary
        if: steps.changesets.outputs.has_changesets != 'true'
        run: |
          echo "⚠️ No changesets to publish"
          echo "To create a changeset, run: pnpm changeset"
          echo "Then commit the changeset file and run this workflow again."

      - name: Success summary
        if: ${{ success() && steps.changesets.outputs.has_changesets == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "🎉 PUBLISH SUCCESSFUL"
          echo "===================="
          echo ""
          echo "Published packages are now available on NPM."
          echo "Check https://www.npmjs.com/org/uswds-wc for the latest versions."
