# Publish workflow for changesets
# Uses OIDC Trusted Publishing - no NPM_TOKEN needed!
# Configure trusted publishers at: https://www.npmjs.com/package/@uswds-wc/[package]/access
# Trusted publishers configured: 2025-12-12
# IMPORTANT: npm v11.5.1+ required for OIDC trusted publishing
# Trigger: 2025-12-13 - Publishing bundle@2.5.4 and data-display@2.5.5 (icon CDN fix)
name: Publish Packages

on:
  push:
    paths:
      - '.github/workflows/changeset-publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip NPM publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (workspace linked)
        run: |
          # Use prefer-workspace-packages to resolve local packages instead of npm
          echo "link-workspace-packages=true" >> .npmrc
          echo "prefer-workspace-packages=true" >> .npmrc
          pnpm install --no-frozen-lockfile
        env:
          # Skip trying to resolve workspace packages from npm
          npm_config_prefer_offline: true

      - name: Build packages
        run: pnpm build

      - name: Build CDN bundle
        run: pnpm run build:cdn

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)
            if [ -n "$CHANGESETS" ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
              echo "📦 Found changesets to publish:"
              echo "$CHANGESETS"
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "⚠️ No changesets found (only README.md)"
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "⚠️ No changesets found"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          echo "📝 Versioning packages..."
          pnpm changeset version
          pnpm install --no-frozen-lockfile
          echo "✅ Packages versioned"

      - name: Commit version changes
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git add .
          git commit -m "chore: version packages" || echo "No changes to commit"
          git push origin main
          echo "✅ Version changes committed and pushed"

      - name: Upgrade npm for OIDC support
        run: |
          echo "📦 Upgrading npm to latest for OIDC trusted publishing..."
          npm install -g npm@latest
          echo "✅ npm version: $(npm --version)"

      - name: Publish to NPM (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🏃 DRY RUN - Would publish these packages:"
          pnpm changeset publish --dry-run || echo "Nothing to publish (already published or no changesets)"

      - name: Publish to NPM
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "📦 Publishing to NPM with OIDC trusted publishing..."
          # Use npm directly with OIDC for each unpublished package
          for pkg in packages/uswds-wc-*/; do
            if [ -f "$pkg/package.json" ]; then
              name=$(jq -r '.name' "$pkg/package.json")
              version=$(jq -r '.version' "$pkg/package.json")
              # Check if version exists on npm
              if ! npm view "$name@$version" version 2>/dev/null; then
                echo "📤 Publishing $name@$version..."
                cd "$pkg" && npm publish --provenance --access public || echo "Failed to publish $name"
                cd - > /dev/null
              else
                echo "⏭️ $name@$version already published"
              fi
            fi
          done
          echo "✅ Publish step completed"
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push tags
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git push origin --tags || echo "No new tags to push"
          echo "✅ Tags pushed"

      - name: Success summary
        run: |
          echo "🎉 WORKFLOW COMPLETED"
          echo "===================="
          echo "Check https://www.npmjs.com/org/uswds-wc for package versions."
